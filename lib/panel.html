<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSH_MCP</title>
<style>
:root{color-scheme:light dark;font:14px/1.5 system-ui,sans-serif}body{margin:0;padding:20px;background:light-dark(#fff,#17191d);color:light-dark(#20242b,#eee)}h1{font-size:23px;margin:0 0 6px}p{color:light-dark(#667085,#aab3c0)}button,textarea{font:inherit}button{cursor:pointer;border:1px solid #8993a566;border-radius:7px;padding:6px 12px;background:transparent;color:inherit}button:hover{background:#8a9bb522}button:disabled{opacity:.4;cursor:default}.layout{display:grid;grid-template-columns:minmax(230px,33%) 1fr;gap:18px;margin-top:20px}.task{display:block;text-align:left;width:100%;padding:12px;margin-bottom:8px}.task.selected{border-color:#5577ed;background:#5577ed15}.meta{font-size:12px;opacity:.65;overflow-wrap:anywhere}.title{font-weight:600;margin:5px 0;overflow-wrap:anywhere}.dot{color:#14a56d}.error{color:#df655a;white-space:pre-wrap}.messages{height:46vh;min-height:220px;overflow:auto;border:1px solid #8993a533;border-radius:10px;padding:16px}.bubble{margin-bottom:18px}.role{font-size:12px;opacity:.65;margin:0 0 6px}pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.65 system-ui}textarea{box-sizing:border-box;width:100%;min-height:80px;border:1px solid #8993a566;border-radius:8px;padding:10px;background:transparent;color:inherit;margin-top:10px}.actions{display:flex;gap:8px;align-items:center;margin-top:8px}.toolbar{display:flex;align-items:center;gap:10px}#notice{font-size:12px;opacity:.7}@media(max-width:700px){.layout{grid-template-columns:1fr}.messages{height:40vh}}
</style>
<h1>DSH_MCP · 独立代理任务</h1><p>Codex 通过工具直接派发。任务使用 DSH 原生子代理，保留上下文并单独管理，不进入普通工作区对话列表。</p>
<div class="toolbar"><button id="refresh">刷新</button><span id="notice">每 3 秒自动更新</span></div><div id="error" class="error"></div>
<div class="layout"><div id="tasks"></div><section><h3 id="heading">选择一个任务查看对话</h3><div class="actions"><button id="older" hidden>更早记录</button><span id="detail" class="meta"></span></div><div class="messages" id="messages"></div><div id="questions"></div><textarea id="input" placeholder="继续这个代理的对话（使用相同上下文）"></textarea><div class="actions"><button id="send">发送给代理</button><button id="cancel">停止当前任务</button><span id="state" class="meta"></span></div></section></div>
<script>
const $=id=>document.getElementById(id);let selected=null,entries=[],records=[],before=null,busy=false,loading=false;
async function api(path,body){const r=await fetch('/dsh-relay'+path,{method:body?'POST':'GET',headers:{'x-dsh-relay-token':'__RELAY_TOKEN__',...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),cache:'no-store'});const v=await r.json();if(!r.ok||!v.ok)throw Error(v.error||'HTTP '+r.status);return v.data}
function element(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function fail(e){$('error').textContent=e?.message||String(e)}
function renderTasks(){const target=$('tasks');target.replaceChildren();if(!entries.length)target.append(element('p','还没有派发任务。首次调用 dsh_delegate 后，会话会出现在这里。'));for(const t of entries){const b=element('button',undefined,'task'+(t.sessionId===selected?' selected':''));b.append(element('span',t.running?'● 运行中':t.error?'● 异常':'○ 空闲 / 已结束',t.running?'dot':''),element('div',t.title||'准备任务','title'),element('div',t.cwd,'meta'),element('div',t.model?[t.model.provider,t.model.model,t.model.reasoningEffort].filter(Boolean).join(' / '):'跟随 DSH 默认模型','meta'));b.onclick=()=>{selected=t.sessionId;records=[];before=null;renderTasks();loadConversation().catch(fail)};target.append(b)}}
function draw(){const target=$('messages'),atBottom=target.scrollHeight-target.scrollTop-target.clientHeight<70;target.replaceChildren();for(const r of records){const e=r.event||r,d=e.data||{};let role='',text='';if(e.type==='user/message'){role='委派 / 追问';text=(d.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n')}else if(e.type==='assistant/message'){role='DeepSeek';text=(d.message?.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n')}else if(e.type==='tool/call'){role='工具调用';text=d.name+'\n'+JSON.stringify(d.arguments||{},null,2)}else if(e.type==='tool/result'){role='工具返回';text=(d.message?.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n')}else if(e.type==='turn/end'){role='本轮结束';text=JSON.stringify(d.reason||{})}if(!role||!text)continue;const bubble=element('div',undefined,'bubble');bubble.append(element('div',role,'role'),element('pre',text));target.append(bubble)}if(atBottom)target.scrollTop=target.scrollHeight}
async function loadConversation(older=false){if(!selected)return;const id=selected;const page=await api('/transcript?sessionId='+encodeURIComponent(id)+(older&&before!==null?'&beforeSeq='+before:''));if(id!==selected)return;const next=page.records||[];records=older?[...next,...records]:next;const first=next[0]?.event||next[0];before=first?.seq??null;$('older').hidden=!page.hasMore;draw();const status=await api('/poll?sessionId='+encodeURIComponent(id));if(id!==selected)return;$('state').textContent=status.status+ (status.pendingTool?' · '+status.pendingTool.name:'');$('detail').textContent=id;$('heading').textContent=entries.find(x=>x.sessionId===id)?.title||'任务对话';$('questions').replaceChildren();if(status.waiting?.intercepted){for(const q of status.waiting.detail||[]){const box=element('div');box.append(element('p',q.question));const answer=element('input');answer.placeholder=(q.options||[]).join(' / ');const b=element('button','回答');b.onclick=async()=>{try{await api('/answer',{sessionId:id,answers:[{id:q.id,selected:[],custom:answer.value}]});await refresh()}catch(e){fail(e)}};box.append(answer,b);$('questions').append(box)}}if(status.waiting?.kind==='approval')$('questions').append(element('p','此代理需要额外权限。可停止任务后，由 Codex 主代理处理需要权限的部分。'));if(entries.find(x=>x.sessionId===id)?.error)throw Error(entries.find(x=>x.sessionId===id).error)}
async function refresh(){if(loading||busy)return;loading=true;try{entries=(await api('/tasks')).sort((a,b)=>(b.updatedAt||b.createdAt)-(a.updatedAt||a.createdAt));renderTasks();if(selected)await loadConversation();$('notice').textContent='已更新 '+new Date().toLocaleTimeString();$('error').textContent=''}catch(e){fail(e)}finally{loading=false}}
$('refresh').onclick=refresh;$('older').onclick=()=>loadConversation(true).catch(fail);$('send').onclick=async()=>{if(!selected||busy||!$('input').value.trim())return;busy=true;$('send').disabled=true;try{await api('/delegate',{sessionId:selected,instruction:$('input').value,takeover:true});$('input').value=''}catch(e){fail(e)}finally{busy=false;$('send').disabled=false;await refresh()}};$('cancel').onclick=async()=>{if(!selected)return;try{await api('/cancel',{sessionId:selected});await refresh()}catch(e){fail(e)}};refresh();setInterval(()=>{if(!document.hidden)refresh()},3000);
</script></html>
